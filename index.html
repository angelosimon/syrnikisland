<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pillo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0b0b0b;
  color: #e5e5e5;
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 280px;
  background: #111111;
  border-right: 1px solid #1f1f1f;
  padding: 16px 0;
}

.sidebar-header {
  padding: 0 24px 20px;
  font-size: 26px;
  font-weight: 600;
  color: #fff;
}

/* Main Area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  background: #0f0f0f;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  padding: 0 32px;
  justify-content: space-between;
}

.model-select {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 9999px;
  padding: 7px 18px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 40px 80px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.welcome {
  text-align: center;
  margin-top: 140px;
}

.welcome h1 {
  font-size: 42px;
  font-weight: 600;
  color: #f0f0f0;
}

.message {
  display: flex;
  gap: 16px;
  max-width: 700px;
}

.message.user { margin-left: auto; flex-direction: row-reverse; }

.bubble {
  padding: 14px 20px;
  border-radius: 18px;
  line-height: 1.65;
  font-size: 15.5px;
}

.message.user .bubble {
  background: #1f1f1f;
  border-bottom-right-radius: 4px;
}

.message.ai .bubble {
  background: #1a1a1a;
  border-bottom-left-radius: 4px;
}

.input-area {
  padding: 20px 80px 32px;
  background: #0b0b0b;
}

.input-box {
  background: #111;
  border: 1px solid #333;
  border-radius: 9999px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
}

#msg-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: #eee;
  font-size: 16px;
}

/* Modals */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: #161616;
  border-radius: 16px;
  width: 400px;
  padding: 28px;
  border: 1px solid #333;
}

.option {
  padding: 16px 20px;
  margin: 8px 0;
  background: #1f1f1f;
  border-radius: 12px;
  cursor: pointer;
}

.option:hover { background: #2a2a2a; }
.option.selected { border: 2px solid #999; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">Pillo</div>
</div>

<div class="main">
  <div class="topbar">
    <div></div>
    <div class="model-select" id="model-select" onclick="openModelModal()">
      <span id="selected-model">KAKAmini</span>
    </div>
    <div onclick="openStyleModal()" style="cursor:pointer;color:#aaa;">
      Стиль: <span id="selected-style">Normal</span>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="welcome" id="welcome">
      <h1>megush returns!</h1>
      <p style="margin-top:16px;color:#888;">How can I help you today?</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="msg-input" rows="1" placeholder="Сообщение..."></textarea>
      <button id="send-btn" style="background:none;border:none;font-size:26px;color:#777;cursor:pointer;">↑</button>
    </div>
  </div>
</div>

<!-- Style Modal -->
<div class="modal" id="style-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:20px;">Стиль общения</h2>
    <div id="style-options"></div>
    <button onclick="closeStyleModal()" style="margin-top:24px;width:100%;padding:12px;background:#222;border:none;border-radius:8px;color:white;">Готово</button>
  </div>
</div>

<!-- Model Modal -->
<div class="modal" id="model-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:20px;">Модель</h2>
    <div id="model-options"></div>
    <button onclick="closeModelModal()" style="margin-top:24px;width:100%;padding:12px;background:#222;border:none;border-radius:8px;color:white;">Готово</button>
  </div>
</div>

<script>
// ================== НАСТРОЙКИ ==================
let currentStyle = "normal";
let currentModel = "kakamini";
let messageCount = 0;

const MAX_LIMIT = {
  kakamini: Infinity,
  kakao2: 32,
  kakagpt: 12,
  pukmini: 25
};

const STYLE_NAMES = {
  normal: "Normal",
  daring: "Daring",
  horrible: "Horrible",
  pukmini: "PUKmini"
};

const MODEL_NAMES = {
  kakamini: "KAKAmini",
  kakao2: "KAKAo2",
  kakagpt: "KAKAGPT-1",
  pukmini: "PUKmini"
};

// ================== SEND ==================
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  messageCount++;
  if (messageCount > MAX_LIMIT[currentModel]) {
    addMessage("ai", `Лимит сообщений для ${MODEL_NAMES[currentModel]} исчерпан.`);
    return;
  }

  addMessage("user", text);
  input.value = "";

  await new Promise(r => setTimeout(r, 600));

  let reply = "Интересно. Расскажи подробнее.";

  if (currentStyle === "horrible" && /нахуй|тварь|сука|ебал|пизда/i.test(text)) {
    reply = "Иди нахуй сам, ебаный мудила.";
  }

  addMessage("ai", reply);
}

function addMessage(role, text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `<div class="bubble">${text}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ================== MODALS ==================
function openStyleModal() {
  const container = document.getElementById('style-options');
  container.innerHTML = '';
  Object.keys(STYLE_NAMES).forEach(key => {
    const div = document.createElement('div');
    div.className = `option ${currentStyle === key ? 'selected' : ''}`;
    div.textContent = STYLE_NAMES[key];
    div.onclick = () => {
      currentStyle = key;
      document.getElementById('selected-style').textContent = STYLE_NAMES[key];
      document.getElementById('style-modal').style.display = 'none';
    };
    container.appendChild(div);
  });
  document.getElementById('style-modal').style.display = 'flex';
}

function openModelModal() {
  const container = document.getElementById('model-options');
  container.innerHTML = '';
  Object.keys(MODEL_NAMES).forEach(key => {
    const div = document.createElement('div');
    div.className = `option ${currentModel === key ? 'selected' : ''}`;
    div.textContent = MODEL_NAMES[key];
    div.onclick = () => {
      currentModel = key;
      messageCount = 0;
      document.getElementById('selected-model').textContent = MODEL_NAMES[key];
      document.getElementById('model-modal').style.display = 'none';
    };
    container.appendChild(div);
  });
  document.getElementById('model-modal').style.display = 'flex';
}

function closeStyleModal() { document.getElementById('style-modal').style.display = 'none'; }
function closeModelModal() { document.getElementById('model-modal').style.display = 'none'; }

// ================== INIT ==================
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('selected-style').textContent = STYLE_NAMES[currentStyle];
document.getElementById('selected-model').textContent = MODEL_NAMES[currentModel];
</script>
</body>
</html>
