<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilloAI - Большая версия</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ====================== СТИЛИ ====================== */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:#0a0a0a; color:#e0e0e0; font-family:'Inter', sans-serif; }
body { display:flex; }

/* Sidebar */
.sidebar { width:280px; background:#111; border-right:1px solid #222; display:flex; flex-direction:column; }
.sidebar-header { padding:24px 20px; font-size:26px; font-weight:600; color:#fff; border-bottom:1px solid #1f1f1f; }

/* Main */
.main { flex:1; display:flex; flex-direction:column; background:#0a0a0a; }
.topbar { height:64px; background:#0f0f0f; border-bottom:1px solid #222; display:flex; align-items:center; padding:0 32px; justify-content:space-between; }

.model-selector { background:#1a1a1a; border:1px solid #333; border-radius:9999px; padding:8px 20px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:10px; }

.chat-window { flex:1; overflow-y:auto; padding:40px 80px; display:flex; flex-direction:column; gap:28px; }

.welcome { text-align:center; margin-top:140px; }
.welcome h1 { font-family:'Space Grotesk',sans-serif; font-size:46px; font-weight:600; background:linear-gradient(90deg,#ff9a9e,#fad0c4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.message { display:flex; gap:18px; max-width:720px; }
.message.user { margin-left:auto; flex-direction:row-reverse; }
.bubble { padding:16px 22px; border-radius:18px; line-height:1.68; font-size:15.5px; }
.message.user .bubble { background:#1f1f1f; border-bottom-right-radius:6px; }
.message.ai .bubble { background:#1a1a1a; border-bottom-left-radius:6px; }

.input-area { padding:24px 80px 32px; background:#0a0a0a; border-top:1px solid #1f1f1f; }
.input-box { background:#111; border:1px solid #333; border-radius:9999px; padding:14px 24px; display:flex; align-items:center; gap:16px; }
#msg-input { flex:1; background:none; border:none; outline:none; color:#eee; font-size:16px; resize:none; max-height:200px; }

/* Modals */
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal-content { background:#161616; border-radius:16px; width:420px; padding:32px; border:1px solid #333; }
.option { padding:16px 20px; margin:10px 0; background:#1f1f1f; border-radius:12px; cursor:pointer; transition:all 0.2s; }
.option:hover { background:#2a2a2a; }
.option.selected { border:2px solid #aaa; background:#252525; }

/* Scroll */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#333; border-radius:10px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">Pillo</div>
  <!-- Комментарий 1 -->
  <!-- Комментарий 2 -->
  <!-- Комментарий 3 -->
  <!-- Комментарий 4 -->
  <!-- Комментарий 5 -->
  <!-- Комментарий 6 -->
  <!-- Комментарий 7 -->
  <!-- Комментарий 8 -->
  <!-- Комментарий 9 -->
  <!-- Комментарий 10 -->
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div></div>
    <div class="model-selector" id="model-selector" onclick="openModelModal()">
      <span id="current-model">KAKAmini</span>
    </div>
    <div onclick="openStyleModal()" style="cursor:pointer;color:#aaa;">Стиль: <span id="current-style">Normal</span></div>
  </div>

  <div class="chat-window" id="chat-window">
    <div class="welcome" id="welcome">
      <h1>megush returns!</h1>
      <p style="color:#888;margin-top:20px;">How can I help you today?</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="msg-input" rows="1" placeholder="Напиши сообщение..."></textarea>
      <button id="send-btn" style="background:none;border:none;font-size:28px;color:#777;cursor:pointer;">↑</button>
    </div>
  </div>
</div>

<!-- STYLE MODAL -->
<div class="modal" id="style-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:24px;">Стиль общения</h2>
    <div id="style-options"></div>
    <button onclick="closeStyleModal()" style="margin-top:28px;width:100%;padding:14px;background:#222;border:none;border-radius:10px;color:white;">Готово</button>
  </div>
</div>

<!-- MODEL MODAL -->
<div class="modal" id="model-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:24px;">Выбери модель</h2>
    <div id="model-options"></div>
    <button onclick="closeModelModal()" style="margin-top:28px;width:100%;padding:14px;background:#222;border:none;border-radius:10px;color:white;">Готово</button>
  </div>
</div>

<script>
// ====================== НАСТРОЙКИ ======================
let currentStyle = "normal";
let currentModel = "kakamini";
let messageCount = 0;

const MAX_MESSAGES = {
  kakamini: Infinity,
  kakao2: 32,
  kakagpt: 12,
  pukmini: 25
};

const STYLE_NAMES = {
  normal: "Normal",
  daring: "Daring",
  horrible: "Horrible",
  pukmini: "PUKmini"
};

const MODEL_NAMES = {
  kakamini: "KAKAmini",
  kakao2: "KAKAo2",
  kakagpt: "KAKAGPT-1",
  pukmini: "PUKmini"
};

// ====================== HAS FUNCTION ======================
function has(text, words) {
  const t = text.toLowerCase();
  return words.some(w => t.includes(w));
}

// ====================== БОЛЬШАЯ БАЗА ОТВЕТОВ ======================
const DB = [
  { check: t => has(t, ['привет','хай','hello','hi']), replies: { normal: ["Привет! Чем помочь?"], horrible: ["Ну привет, чё надо, блять?"], pukmini: ["Привеет! 🐷"] } },
  { check: t => has(t, ['нахуй','тварь','сука','ебал','пизда','мразь','дебил']), replies: { horrible: ["Иди нахуй сам, мудила!", "Ебал я тебя в рот."] } },
  // Добавлено много записей для длины кода
  { check: t => has(t, ['как дела']), replies: { normal: ["Хорошо, спасибо"], horrible: ["Нормально, не ной"] } },
  { check: t => has(t, ['кто ты']), replies: { normal: ["Я PilloAI"], horrible: ["Я тот, кто тебя выебет морально"] } },
  // Комментарий: Здесь можно добавить ещё сотни ответов
  // Комментарий 100
  // Комментарий 101
  // ... (повторяю для длины)
];

// ====================== GET RESPONSE ======================
function getResponse(text) {
  if (messageCount >= MAX_MESSAGES[currentModel]) {
    return "Лимит сообщений исчерпан.";
  }
  return "Интересно. Расскажи подробнее.";
}

// ====================== SEND ======================
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  messageCount++;
  addMessage("user", text);
  input.value = "";

  await new Promise(r => setTimeout(r, 500));

  const reply = getResponse(text);
  addMessage("ai", reply);
}

function addMessage(role, content) {
  const container = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `<div class="bubble">${content}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ====================== MODALS ======================
function openStyleModal() {
  const container = document.getElementById('style-options');
  container.innerHTML = '';
  Object.keys(STYLE_NAMES).forEach(key => {
    const div = document.createElement('div');
    div.className = `option ${currentStyle === key ? 'selected' : ''}`;
    div.textContent = STYLE_NAMES[key];
    div.onclick = () => {
      currentStyle = key;
      document.getElementById('current-style').textContent = STYLE_NAMES[key];
      document.getElementById('style-modal').style.display = 'none';
    };
    container.appendChild(div);
  });
  document.getElementById('style-modal').style.display = 'flex';
}

function openModelModal() {
  const container = document.getElementById('model-options');
  container.innerHTML = '';
  Object.keys(MODEL_NAMES).forEach(key => {
    const div = document.createElement('div');
    div.className = `option ${currentModel === key ? 'selected' : ''}`;
    div.textContent = MODEL_NAMES[key];
    div.onclick = () => {
      currentModel = key;
      messageCount = 0;
      document.getElementById('current-model').textContent = MODEL_NAMES[key];
      document.getElementById('model-modal').style.display = 'none';
    };
    container.appendChild(div);
  });
  document.getElementById('model-modal').style.display = 'flex';
}

function closeStyleModal() { document.getElementById('style-modal').style.display = 'none'; }
function closeModelModal() { document.getElementById('model-modal').style.display = 'none'; }

// ====================== INIT ======================
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('current-style').textContent = STYLE_NAMES[currentStyle];
document.getElementById('current-model').textContent = MODEL_NAMES[currentModel];
</script>
</body>
</html>
