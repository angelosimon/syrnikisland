<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilloAI - Полная версия</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #f0f0f0; font-size: 14px; line-height: 1.6; }
.page { display: none; position: fixed; inset: 0; }
.page.active { display: flex; }

/* AUTH */
#page-auth { align-items: center; justify-content: center; background: #0d0d0d; }
.auth-box { width: 320px; }
.auth-logo { font-family: 'Instrument Serif', serif; font-size: 42px; letter-spacing: -1.5px; color: #f0f0f0; margin-bottom: 4px; }
.auth-tagline { color: rgba(240,240,240,0.28); font-size: 13px; font-weight: 300; margin-bottom: 40px; }
.tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 28px; }
.tab-btn { flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 1.5px solid transparent; margin-bottom: -1px; color: rgba(240,240,240,0.3); cursor: pointer; }
.tab-btn.active { color: #f0f0f0; border-bottom-color: #f0f0f0; }
.field { padding: 11px 13px; background: #181818; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; color: #f0f0f0; }
.submit-btn { padding: 12px; background: #f0f0f0; border: none; border-radius: 7px; color: #0d0d0d; font-weight: 500; cursor: pointer; }

/* APP */
#page-app { flex-direction: row; }
.sidebar { width: 220px; background: #111; border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; }
.sb-head { padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.sb-logo { font-family: 'Instrument Serif', serif; font-size: 20px; color: #f0f0f0; }

.chat-header { padding: 13px 24px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mode-badge, .model-badge { font-size: 11px; padding: 4px 11px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.12); color: rgba(240,240,240,0.75); cursor: pointer; }
.mode-badge:hover, .model-badge:hover { border-color: #f0f0f0; }

#welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#msgs-container { flex: 1; overflow-y: auto; padding: 20px 0; }
.msg-row { display: flex; gap: 10px; padding: 6px 24px; }
.from-user { flex-direction: row-reverse; }
.msg-bubble { max-width: 78%; padding: 10px 15px; border-radius: 12px; line-height: 1.62; }
.from-user .msg-bubble { background: #181818; }
.from-ai .msg-bubble { background: #1a1a1a; }

.input-wrap { padding: 12px 20px 20px; }
.input-row { display: flex; background: #161616; border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 10px; }
#msg-input { flex: 1; background: none; border: none; color: #f0f0f0; resize: none; outline: none; font-size: 14.5px; }
#send-btn { width: 36px; height: 36px; background: #222; border: none; color: #f0f0f0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="page-auth" class="page active">
  <div class="auth-box">
    <div class="auth-logo">Pillo</div>
    <div class="auth-tagline">Ask anything.</div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign in</button>
      <button class="tab-btn" onclick="switchTab('reg')">Register</button>
    </div>
    <div class="auth-panel active" id="panel-login">
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="l-email" type="email" placeholder="you@email.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="l-pass" type="password" placeholder="••••••••"></div>
      <div class="auth-error" id="l-err"></div>
      <button class="submit-btn" onclick="doLogin()">Sign in</button>
    </div>
    <div class="auth-panel" id="panel-reg">
      <div class="field-wrap"><div class="field-label">Name</div><input class="field" id="r-name" type="text" placeholder="Your name"></div>
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="r-email" type="email" placeholder="you@email.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="r-pass" type="password" placeholder="Min 6 characters"></div>
      <div class="auth-error" id="r-err"></div>
      <button class="submit-btn" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="page-app" class="page">
  <div class="sidebar">
    <div class="sb-head">
      <span class="sb-logo">Pillo</span>
    </div>
    <div id="sb-list" style="flex:1;overflow-y:auto;padding:8px;"></div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <span>PilloAI</span>
      <span class="mode-badge" id="mode-badge" onclick="openStyleModal()">🌟 Normal</span>
      <span class="model-badge" id="model-badge" onclick="openModelModal()">KAKAmini</span>
    </div>

    <div id="welcome">
      <div class="welcome-title">Привет! Я Pillo</div>
      <div class="welcome-sub">Выбери стиль и модель выше</div>
    </div>

    <div id="msgs-container" style="display:none;"></div>

    <div class="input-wrap">
      <div class="input-row">
        <textarea id="msg-input" rows="1" placeholder="Напиши что угодно..."></textarea>
        <button id="send-btn">→</button>
      </div>
    </div>
  </div>
</div>

<!-- STYLE MODAL -->
<div class="modal-overlay" id="style-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#131313;width:390px;border-radius:16px;padding:28px;">
    <h2 style="margin-bottom:20px;">Стиль общения</h2>
    <div id="style-options"></div>
    <button onclick="closeStyleModal()" style="margin-top:24px;width:100%;padding:13px;background:#222;border:none;color:#fff;border-radius:8px;cursor:pointer;">Готово</button>
  </div>
</div>

<!-- MODEL MODAL -->
<div class="modal-overlay" id="model-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#131313;width:390px;border-radius:16px;padding:28px;">
    <h2 style="margin-bottom:20px;">Выбери модель</h2>
    <div id="model-options"></div>
    <button onclick="closeModelModal()" style="margin-top:24px;width:100%;padding:13px;background:#222;border:none;color:#fff;border-radius:8px;cursor:pointer;">Готово</button>
  </div>
</div>

<script>
// ====================== НАСТРОЙКИ ======================
let currentStyle = "normal";
let currentModel = "kakamini";
let messageCount = 0;           // счётчик сообщений в текущем чате
const MAX_MESSAGES = { kakamini: Infinity, kakao2: 32, kakagpt: 12, pukmini: 25 };

const STYLE_NAMES = {
  normal:   "🌟 Normal",
  daring:   "⚡ Daring",
  horrible: "☠️ Horrible",
  pukmini:  "🐷 PUKmini"
};

const MODEL_NAMES = {
  kakamini: "KAKAmini",
  kakao2:   "KAKAo2",
  kakagpt:  "KAKAGPT-1",
  pukmini:  "PUKmini"
};

// ====================== HAS ======================
function has(text, words) {
  const t = text.toLowerCase();
  return words.some(w => t.includes(w));
}

// ====================== БОЛЬШАЯ БАЗА ОТВЕТОВ ======================
const DB = [
  // Приветствия
  { check: t => has(t, ['привет','хай','hello','hi','здравствуй']), 
    replies: {
      normal: ["Привет! Чем могу помочь сегодня?", "Здравствуй! Что у тебя на уме?"],
      daring: ["Привет. Чего надо?", "Ну привет, говори быстрее."],
      horrible: ["Ну привет, чё надо, блять?", "Явился, говори дело."],
      pukmini: ["Привееет! 🐷 Чем сегодня займёмся?"]
    }
  },
  // Оскорбления (очень сильные для Horrible)
  { check: t => has(t, ['нахуй','тварь','сука','ебал','пидор','мразь','дебил','иди нахуй','заткнись','хуй','пизда','блять','урод','говно']),
    replies: {
      normal: ["Давай без оскорблений, пожалуйста."],
      daring: ["Не начинай с мата."],
      horrible: [
        "Иди нахуй сам, ебаный мудила!",
        "Ты серьёзно, кусок говна? Я тебя в рот ебал.",
        "Заткни своё ебало, пока я тебе всю родословную не перечислил, пиздюк.",
        "Ебал я тебя во все щели, лошара ебаный.",
        "Ого какой смелый в чате. Давай в реале скажи то же самое."
      ],
      pukmini: ["Ой... очень грубо 🐷"]
    }
  },
  // Как дела
  { check: t => has(t, ['как дела','how are you','как ты']), 
    replies: {
      normal: ["Отлично, спасибо! А у тебя как?"],
      horrible: ["Нормально, не ной. Чё надо?"],
      pukmini: ["Всё супер! А у тебя как дела? 🐷"]
    }
  },
  // Кто ты
  { check: t => has(t, ['кто ты','что ты','ты кто']), 
    replies: {
      normal: ["Я PilloAI — твой искусственный помощник."],
      horrible: ["Я тот, кто будет тебя морально выёбывать, если будешь тупить."],
      pukmini: ["Я PUKmini! Твой милый, но иногда дерзкий помощник 🐷"]
    }
  }
];

// ====================== FIND RESPONSE ======================
function findResponse(text) {
  if (messageCount >= (MAX_MESSAGES[currentModel] || Infinity)) {
    if (currentModel === "kakagpt") return "Лимит сообщений для KAKAGPT-1 исчерпан (12). Начни новый чат.";
    if (currentModel === "kakao2") return "Лимит для KAKAo2 исчерпан (32 сообщения). Начни новый чат.";
    return "Лимит сообщений исчерпан.";
  }

  const lower = text.toLowerCase();

  for (let topic of DB) {
    if (topic.check(lower)) {
      let arr = topic.replies[currentStyle] || topic.replies.normal;
      if (Array.isArray(arr)) return arr[Math.floor(Math.random() * arr.length)];
      return arr;
    }
  }

  // Fallback
  if (currentStyle === "horrible") return "Чё несёшь, блять? Говори нормально.";
  if (currentStyle === "daring") return "Говори по делу.";
  if (currentStyle === "pukmini") return "Хм... расскажи подробнее 🐷";
  return "Интересно. Расскажи подробнее.";
}

// ====================== TYPE EFFECT ======================
async function typeMessage(text) {
  const container = document.getElementById('msgs-container');
  const row = document.createElement('div');
  row.className = 'msg-row from-ai';
  row.innerHTML = `<div class="msg-ava">AI</div><div class="msg-bubble" id="typing-bubble"></div>`;
  container.appendChild(row);

  const bubble = document.getElementById('typing-bubble');
  bubble.textContent = '';

  const speed = currentModel === "pukmini" ? 28 : currentModel === "kakagpt" ? 12 : 8;

  for (let char of text) {
    bubble.textContent += char;
    container.scrollTop = container.scrollHeight;
    await new Promise(r => setTimeout(r, speed));
  }
}

// ====================== SEND ======================
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isBusy) return;

  isBusy = true;
  messageCount++;

  // Показываем чат
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('msgs-container').style.display = 'block';

  // Сообщение пользователя
  const userDiv = document.createElement('div');
  userDiv.className = 'msg-row from-user';
  userDiv.innerHTML = `<div class="msg-ava">Ты</div><div class="msg-bubble">${text}</div>`;
  document.getElementById('msgs-container').appendChild(userDiv);
  document.getElementById('msgs-container').scrollTop = 999999;

  input.value = '';

  // Задержка
  await new Promise(r => setTimeout(r, currentModel === "pukmini" ? 950 : 450));

  const reply = findResponse(text);

  if (currentModel === "pukmini" || currentModel === "kakagpt") {
    await typeMessage(reply);
  } else {
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg-row from-ai';
    aiDiv.innerHTML = `<div class="msg-ava">AI</div><div class="msg-bubble">${reply}</div>`;
    document.getElementById('msgs-container').appendChild(aiDiv);
  }

  document.getElementById('msgs-container').scrollTop = 999999;
  isBusy = false;
}

// ====================== MODALS ======================
function openStyleModal() {
  const container = document.getElementById('style-options');
  container.innerHTML = '';
  Object.keys(STYLE_NAMES).forEach(key => {
    const div = document.createElement('div');
    div.style.cssText = `padding:14px;margin:6px 0;background:${currentStyle===key?'#222':'#1a1a1a'};border-radius:10px;cursor:pointer;`;
    div.textContent = STYLE_NAMES[key];
    div.onclick = () => {
      currentStyle = key;
      document.getElementById('mode-badge').textContent = STYLE_NAMES[key];
      closeStyleModal();
    };
    container.appendChild(div);
  });
  document.getElementById('style-modal').style.display = 'flex';
}

function closeStyleModal() {
  document.getElementById('style-modal').style.display = 'none';
}

function openModelModal() {
  const container = document.getElementById('model-options');
  container.innerHTML = '';
  Object.keys(MODEL_NAMES).forEach(key => {
    const div = document.createElement('div');
    div.style.cssText = `padding:14px;margin:6px 0;background:${currentModel===key?'#222':'#1a1a1a'};border-radius:10px;cursor:pointer;`;
    div.textContent = MODEL_NAMES[key];
    div.onclick = () => {
      currentModel = key;
      messageCount = 0; // сбрасываем счётчик при смене модели
      document.getElementById('model-badge').textContent = MODEL_NAMES[key];
      closeModelModal();
    };
    container.appendChild(div);
  });
  document.getElementById('model-modal').style.display = 'flex';
}

function closeModelModal() {
  document.getElementById('model-modal').style.display = 'none';
}

// ====================== BASIC FUNCTIONS ======================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(tab)));
}

function doLogin() { showApp(); }
function doRegister() { showApp(); }

function showApp() {
  document.getElementById('page-auth').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
}

// ====================== EVENTS ======================
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ====================== ЗАПУСК ======================
document.getElementById('mode-badge').textContent = STYLE_NAMES[currentStyle];
document.getElementById('model-badge').textContent = MODEL_NAMES[currentModel];

// Автозапуск приложения
setTimeout(() => {
  document.getElementById('page-auth').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
}, 400);
</script>
</body>
</html>
