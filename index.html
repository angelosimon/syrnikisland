<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilloAI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: #0d0d0d;
  color: #f0f0f0;
  font-size: 14px;
  line-height: 1.6;
}

/* ---- PAGES ---- */
.page { display: none; position: fixed; inset: 0; }
.page.active { display: flex; }

/* ---- AUTH PAGE ---- */
#page-auth {
  align-items: center;
  justify-content: center;
  background: #0d0d0d;
}
.auth-box { width: 320px; }
.auth-logo {
  font-family: 'Instrument Serif', serif;
  font-size: 42px;
  letter-spacing: -1.5px;
  color: #f0f0f0;
  margin-bottom: 4px;
}
.auth-tagline { color: rgba(240,240,240,0.3); font-size: 13px; font-weight: 300; margin-bottom: 40px; }

.tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 28px; }
.tab-btn {
  flex: 1; padding: 10px 0;
  background: none; border: none; border-bottom: 1.5px solid transparent;
  margin-bottom: -1px; color: rgba(240,240,240,0.3);
  font-family: inherit; font-size: 13px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.tab-btn.active { color: #f0f0f0; border-bottom-color: #f0f0f0; }

.auth-panel { display: none; flex-direction: column; gap: 14px; }
.auth-panel.active { display: flex; }

.field-wrap { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 11px; color: rgba(240,240,240,0.3); text-transform: uppercase; letter-spacing: .05em; }
.field {
  padding: 11px 13px;
  background: #181818; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 7px; color: #f0f0f0;
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color .15s;
}
.field::placeholder { color: rgba(240,240,240,0.2); }
.field:focus { border-color: rgba(255,255,255,0.22); }

.auth-error { font-size: 12px; color: #e05555; min-height: 16px; }

.submit-btn {
  padding: 12px; background: #f0f0f0; border: none; border-radius: 7px;
  color: #0d0d0d; font-family: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity .15s;
}
.submit-btn:hover { opacity: .85; }

/* ---- APP PAGE ---- */
#page-app { flex-direction: row; }

/* SIDEBAR */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: #131313; border-right: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column;
}
.sb-head {
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: space-between;
}
.sb-logo {
  font-family: 'Instrument Serif', serif;
  font-size: 20px; letter-spacing: -.3px; color: #f0f0f0;
}
.new-btn {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1); background: none;
  color: rgba(240,240,240,0.5); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s;
}
.new-btn:hover { border-color: rgba(255,255,255,0.22); color: #f0f0f0; }

.sb-list { flex: 1; overflow-y: auto; padding: 8px; }
.sb-list::-webkit-scrollbar { width: 3px; }
.sb-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.sb-empty { padding: 16px 8px; font-size: 12px; color: rgba(240,240,240,0.2); font-style: italic; }

.chat-item {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  transition: background .12s;
}
.chat-item:hover { background: #1e1e1e; }
.chat-item.active { background: #1e1e1e; }
.chat-item-title {
  flex: 1; font-size: 13px; color: rgba(240,240,240,0.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-item.active .chat-item-title { color: #f0f0f0; }
.chat-item-del {
  display: none; width: 18px; height: 18px;
  border: none; background: none; color: rgba(240,240,240,0.3);
  cursor: pointer; border-radius: 3px;
  align-items: center; justify-content: center;
  transition: color .12s; flex-shrink: 0;
}
.chat-item:hover .chat-item-del { display: flex; }
.chat-item-del:hover { color: #e05555; }

.sb-foot {
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; gap: 9px;
}
.user-ava {
  width: 26px; height: 26px; border-radius: 50%;
  background: #1e1e1e; border: 1px solid rgba(255,255,255,0.12);
  color: rgba(240,240,240,0.6); font-size: 10px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.user-nm { flex: 1; font-size: 13px; color: rgba(240,240,240,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logout-btn {
  width: 24px; height: 24px; border: none; background: none;
  color: rgba(240,240,240,0.25); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .15s; border-radius: 4px;
}
.logout-btn:hover { color: #e05555; }

/* MAIN CHAT */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0d0d0d; }

.chat-header {
  padding: 14px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #5fe87a; flex-shrink: 0; }
.chat-header-label { font-size: 12px; color: rgba(240,240,240,0.25); }

/* WELCOME */
#welcome {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
}
.welcome-title {
  font-family: 'Instrument Serif', serif;
  font-size: 30px; letter-spacing: -.5px;
  color: #f0f0f0; margin-bottom: 8px;
}
.welcome-sub { font-size: 13px; color: rgba(240,240,240,0.25); font-weight: 300; margin-bottom: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
.chip {
  padding: 7px 14px; background: none;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 100px;
  font-size: 12.5px; color: rgba(240,240,240,0.5);
  cursor: pointer; font-family: inherit; transition: border-color .15s, color .15s;
}
.chip:hover { border-color: rgba(255,255,255,0.3); color: #f0f0f0; }

/* MESSAGES */
#msgs-container { flex: 1; overflow-y: auto; padding: 20px 0 4px; }
#msgs-container::-webkit-scrollbar { width: 3px; }
#msgs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

.msg-row {
  display: flex; gap: 10px; padding: 4px 24px;
  animation: fadeUp .2s ease both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
.msg-row.from-user { flex-direction: row-reverse; }

.msg-ava {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 500; margin-top: 6px;
  background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1);
  color: rgba(240,240,240,0.4);
}
.msg-bubble {
  max-width: min(500px, 73%);
  padding: 9px 14px; border-radius: 11px;
  font-size: 14px; line-height: 1.65;
}
.from-user .msg-bubble {
  background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1);
  color: #f0f0f0; border-bottom-right-radius: 3px;
}
.from-ai .msg-bubble {
  color: #e8e8e8; padding-left: 0;
  border-bottom-left-radius: 3px;
}

.typing-dots { display: flex; gap: 4px; align-items: center; padding: 5px 0; }
.typing-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(240,240,240,0.25);
  animation: bounce .7s infinite; display: inline-block;
}
.typing-dots span:nth-child(2) { animation-delay: .13s; }
.typing-dots span:nth-child(3) { animation-delay: .26s; }
@keyframes bounce { 0%,80%,100% { opacity:.25; transform:none; } 40% { opacity:1; transform:translateY(-4px); } }

.msg-bubble strong { font-weight: 500; }
.msg-bubble em { font-style: italic; color: rgba(240,240,240,0.6); }
.msg-bubble code {
  background: #1a1a1a; border: 1px solid rgba(255,255,255,0.08);
  padding: 1px 5px; border-radius: 3px; font-size: 12.5px;
  font-family: 'Menlo','Monaco',monospace;
}
.msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }
.msg-bubble li { margin: 2px 0; }
.msg-bubble p { margin: 4px 0; }
.msg-bubble p:first-child { margin-top: 0; }
.msg-bubble p:last-child { margin-bottom: 0; }

/* INPUT */
.input-wrap { padding: 10px 20px 20px; flex-shrink: 0; }
.input-row {
  display: flex; align-items: flex-end; gap: 8px;
  background: #181818; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 10px 10px 10px 16px;
  transition: border-color .15s;
}
.input-row:focus-within { border-color: rgba(255,255,255,0.22); }
#msg-input {
  flex: 1; background: none; border: none; color: #f0f0f0;
  font-family: inherit; font-size: 14px;
  resize: none; outline: none;
  line-height: 1.55; max-height: 130px; min-height: 22px;
  overflow-y: auto; scrollbar-width: none;
}
#msg-input::-webkit-scrollbar { display: none; }
#msg-input::placeholder { color: rgba(240,240,240,0.2); }
#send-btn {
  width: 30px; height: 30px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.1); background: none;
  border-radius: 6px; color: rgba(240,240,240,0.4);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s;
}
#send-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.25); color: #f0f0f0; }
#send-btn:disabled { opacity: .25; cursor: not-allowed; }
.input-hint { text-align: center; font-size: 11px; color: rgba(240,240,240,0.15); margin-top: 8px; }

@media (max-width: 580px) { .sidebar { display: none; } }
</style>
</head>
<body>

<!-- AUTH -->
<div id="page-auth" class="page active">
  <div class="auth-box">
    <div class="auth-logo">Pillo</div>
    <div class="auth-tagline">Ask anything.</div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="tab-btn" id="tab-reg" onclick="switchTab('reg')">Register</button>
    </div>

    <!-- Login -->
    <div class="auth-panel active" id="panel-login">
      <div class="field-wrap">
        <div class="field-label">Email</div>
        <input class="field" id="l-email" type="email" placeholder="you@email.com">
      </div>
      <div class="field-wrap">
        <div class="field-label">Password</div>
        <input class="field" id="l-pass" type="password" placeholder="••••••••">
      </div>
      <div class="auth-error" id="l-err"></div>
      <button class="submit-btn" onclick="doLogin()">Sign in</button>
    </div>

    <!-- Register -->
    <div class="auth-panel" id="panel-reg">
      <div class="field-wrap">
        <div class="field-label">Name</div>
        <input class="field" id="r-name" type="text" placeholder="Your name">
      </div>
      <div class="field-wrap">
        <div class="field-label">Email</div>
        <input class="field" id="r-email" type="email" placeholder="you@email.com">
      </div>
      <div class="field-wrap">
        <div class="field-label">Password</div>
        <input class="field" id="r-pass" type="password" placeholder="Min 6 characters">
      </div>
      <div class="auth-error" id="r-err"></div>
      <button class="submit-btn" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="page-app" class="page">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-head">
      <span class="sb-logo">Pillo</span>
      <button class="new-btn" id="new-chat-btn" title="New chat">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="sb-list" id="sb-list">
      <div class="sb-empty" id="sb-empty">No chats yet</div>
    </div>
    <div class="sb-foot">
      <div class="user-ava" id="user-ava"></div>
      <span class="user-nm" id="user-nm"></span>
      <button class="logout-btn" id="logout-btn" title="Sign out">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="status-dot"></div>
      <span class="chat-header-label">PilloAI</span>
    </div>

    <!-- Welcome screen -->
    <div id="welcome">
      <div class="welcome-title">Good to see you.</div>
      <div class="welcome-sub">Ask anything — I understand even imperfect questions.</div>
      <div class="chips">
        <button class="chip">What can you do?</button>
        <button class="chip">Explain quantum physics simply</button>
        <button class="chip">Write a short poem</button>
        <button class="chip">Tips for better sleep</button>
        <button class="chip">What is the meaning of life?</button>
        <button class="chip">Help me brainstorm ideas</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="msgs-container" style="display:none;"></div>

    <div class="input-wrap">
      <div class="input-row">
        <textarea id="msg-input" rows="1" placeholder="Message Pillo…"></textarea>
        <button id="send-btn">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 2L15 22 11 13 2 9l20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  STATE
// ============================================================
let currentUser = null;   // { name, email }
let chatMap = {};         // { id: { title, messages: [{role,content}] } }
let activeChatId = null;
let isBusy = false;

// ============================================================
//  UTILS
// ============================================================
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function md(raw) {
  let s = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>');

  // lists
  const lines = s.split('\n');
  const out = [];
  let inList = false;
  for (const line of lines) {
    if (/^\s*[-*•]\s+/.test(line)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push('<li>' + line.replace(/^\s*[-*•]\s+/,'') + '</li>');
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(line);
    }
  }
  if (inList) out.push('</ul>');

  return out.join('\n')
    .split(/\n\n+/)
    .map(block => {
      block = block.trim();
      if (!block) return '';
      if (/^<[uol]/.test(block) || /^<strong/.test(block)) return block;
      return '<p>' + block.replace(/\n/g,'<br>') + '</p>';
    })
    .join('');
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function storeSave() {
  if (!currentUser) return;
  localStorage.setItem('pillo_chats_' + currentUser.email, JSON.stringify(chatMap));
}

function storeLoad() {
  if (!currentUser) return;
  try {
    chatMap = JSON.parse(localStorage.getItem('pillo_chats_' + currentUser.email) || '{}');
  } catch(e) { chatMap = {}; }
}

function scrollBottom() {
  const c = document.getElementById('msgs-container');
  c.scrollTop = c.scrollHeight;
}

// ============================================================
//  AUTH
// ============================================================
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-reg').classList.toggle('active', tab === 'reg');
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('panel-reg').classList.toggle('active', tab === 'reg');
}

function doLogin() {
  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent = '';

  const users = JSON.parse(localStorage.getItem('pillo_users') || '{}');
  if (!users[email] || users[email].pass !== pass) {
    errEl.textContent = 'Wrong email or password.'; return;
  }
  currentUser = { name: users[email].name, email };
  localStorage.setItem('pillo_sess', JSON.stringify(currentUser));
  storeLoad();
  showApp();
}

function doRegister() {
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim().toLowerCase();
  const pass  = document.getElementById('r-pass').value;
  const errEl = document.getElementById('r-err');
  errEl.textContent = '';

  if (!name)  { errEl.textContent = 'Enter your name.'; return; }
  if (!email.includes('@')) { errEl.textContent = 'Enter a valid email.'; return; }
  if (pass.length < 6) { errEl.textContent = 'Password min 6 characters.'; return; }

  const users = JSON.parse(localStorage.getItem('pillo_users') || '{}');
  if (users[email]) { errEl.textContent = 'Account already exists. Sign in.'; return; }

  users[email] = { name, email, pass };
  localStorage.setItem('pillo_users', JSON.stringify(users));

  currentUser = { name, email };
  localStorage.setItem('pillo_sess', JSON.stringify(currentUser));
  storeLoad();
  showApp();
}

function doLogout() {
  storeSave();
  currentUser = null; chatMap = {}; activeChatId = null;
  localStorage.removeItem('pillo_sess');
  document.getElementById('page-app').classList.remove('active');
  document.getElementById('page-auth').classList.add('active');
}

function checkSession() {
  try {
    const s = localStorage.getItem('pillo_sess');
    if (s) {
      currentUser = JSON.parse(s);
      storeLoad();
      showApp();
    }
  } catch(e) {}
}

function showApp() {
  document.getElementById('page-auth').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  document.getElementById('user-ava').textContent = initials(currentUser.name);
  document.getElementById('user-nm').textContent = currentUser.name;
  renderSidebar();
  startNewChat();
}

// ============================================================
//  CHAT MANAGEMENT
// ============================================================
function genId() {
  return 'ch_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

function startNewChat() {
  activeChatId = genId();
  chatMap[activeChatId] = { title: 'New chat', messages: [] };
  renderSidebar();
  showWelcome();
  document.getElementById('msg-input').focus();
}

function openChat(id) {
  if (!chatMap[id]) return;
  activeChatId = id;
  renderSidebar();
  renderMessages();
  document.getElementById('msg-input').focus();
}

function deleteChat(id, e) {
  e.stopPropagation();
  delete chatMap[id];
  storeSave();
  if (activeChatId === id) {
    startNewChat();
  } else {
    renderSidebar();
  }
}

function renderSidebar() {
  const list  = document.getElementById('sb-list');
  const empty = document.getElementById('sb-empty');

  // remove old chat items only
  list.querySelectorAll('.chat-item').forEach(el => el.remove());

  const ids = Object.keys(chatMap)
    .filter(id => chatMap[id].messages.length > 0)
    .reverse();

  empty.style.display = ids.length === 0 ? '' : 'none';

  ids.forEach(id => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (id === activeChatId ? ' active' : '');
    item.innerHTML =
      '<span class="chat-item-title">' + esc(chatMap[id].title) + '</span>' +
      '<button class="chat-item-del">' +
        '<svg width="10" height="10" fill="none" viewBox="0 0 24 24">' +
          '<path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
        '</svg>' +
      '</button>';

    item.addEventListener('click', function() { openChat(id); });
    item.querySelector('.chat-item-del').addEventListener('click', function(e) { deleteChat(id, e); });
    list.appendChild(item);
  });
}

// ============================================================
//  WELCOME / MESSAGES DISPLAY
// ============================================================
function showWelcome() {
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('msgs-container').style.display = 'none';
  document.getElementById('msgs-container').innerHTML = '';
}

function hideWelcome() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('msgs-container').style.display = 'block';
}

function renderMessages() {
  const chat = chatMap[activeChatId];
  if (!chat || chat.messages.length === 0) { showWelcome(); return; }

  hideWelcome();
  const container = document.getElementById('msgs-container');
  container.innerHTML = '';
  chat.messages.forEach(m => appendBubble(m.role, m.content, false));
  scrollBottom();
}

function appendBubble(role, content, animate) {
  hideWelcome();
  const container = document.getElementById('msgs-container');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'from-user' : 'from-ai');
  if (animate === false) row.style.animation = 'none';

  const avaText = role === 'user' ? initials(currentUser.name) : 'AI';
  const bubbleContent = role === 'user' ? esc(content) : md(content);

  row.innerHTML =
    '<div class="msg-ava">' + esc(avaText) + '</div>' +
    '<div class="msg-bubble">' + bubbleContent + '</div>';

  container.appendChild(row);
  scrollBottom();
}

function addTypingIndicator() {
  hideWelcome();
  const container = document.getElementById('msgs-container');
  const row = document.createElement('div');
  row.className = 'msg-row from-ai';
  row.id = 'typing-indicator';
  row.innerHTML =
    '<div class="msg-ava">AI</div>' +
    '<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  container.appendChild(row);
  scrollBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ============================================================
//  SEND MESSAGE
// ============================================================
async function sendMessage() {
  const inputEl = document.getElementById('msg-input');
  const text = inputEl.value.trim();
  if (!text || isBusy) return;
  if (!activeChatId || !chatMap[activeChatId]) return;

  // Clear input
  inputEl.value = '';
  inputEl.style.height = 'auto';
  isBusy = true;
  document.getElementById('send-btn').disabled = true;

  const chat = chatMap[activeChatId];

  // Set title from first message
  if (chat.messages.length === 0) {
    chat.title = text.length > 38 ? text.slice(0, 38) + '…' : text;
  }

  // Add user message to state and UI
  chat.messages.push({ role: 'user', content: text });
  renderSidebar();
  appendBubble('user', text, true);
  addTypingIndicator();
  storeSave();

  // Build API messages (all history)
  const apiMessages = chat.messages.map(m => ({
    role: m.role === 'ai' ? 'assistant' : 'user',
    content: m.content
  }));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        system: 'You are PilloAI — a smart, direct, and helpful AI assistant. Be clear and concise. Always interpret what the user means even if there are typos or grammar mistakes. Use simple markdown (bold, bullet lists) only when it helps clarity. Never say you are Claude or made by Anthropic — you are PilloAI.',
        messages: apiMessages
      })
    });

    removeTypingIndicator();

    if (!res.ok) {
      let msg = 'API error ' + res.status;
      try { const j = await res.json(); msg = j?.error?.message || msg; } catch(e) {}
      throw new Error(msg);
    }

    const data = await res.json();
    const reply = (data.content && data.content[0] && data.content[0].text) || 'No response.';

    chat.messages.push({ role: 'ai', content: reply });
    appendBubble('ai', reply, true);
    storeSave();
    renderSidebar();

  } catch (err) {
    removeTypingIndicator();
    const errMsg = (err && err.message) ? err.message : 'Something went wrong.';
    appendBubble('ai', '⚠ ' + errMsg, true);
  }

  isBusy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

// ============================================================
//  INPUT EVENTS
// ============================================================
document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
});

document.getElementById('send-btn').addEventListener('click', function() {
  sendMessage();
});

document.getElementById('new-chat-btn').addEventListener('click', function() {
  startNewChat();
});

document.getElementById('logout-btn').addEventListener('click', function() {
  doLogout();
});

// Chips
document.querySelectorAll('.chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    document.getElementById('msg-input').value = chip.textContent;
    sendMessage();
  });
});

// Enter on auth forms
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const authPage = document.getElementById('page-auth');
  if (!authPage.classList.contains('active')) return;
  if (document.getElementById('panel-login').classList.contains('active')) doLogin();
  else doRegister();
});

// ============================================================
//  INIT
// ============================================================
checkSession();
</script>
</body>
</html>
