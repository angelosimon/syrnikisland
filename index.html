<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pillo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: 'Inter', system-ui, sans-serif; 
  background: #0a0a0a; 
  color: #e0e0e0; 
  height: 100vh; 
  overflow: hidden;
  display: flex;
}

.sidebar {
  width: 260px;
  background: #111111;
  border-right: 1px solid #222;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 20px 24px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.5px;
}

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #0a0a0a;
}

.top-bar {
  height: 60px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  padding: 0 24px;
  justify-content: space-between;
  background: #111;
}

.model-selector {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 9999px;
  padding: 6px 16px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.main-chat {
  flex: 1;
  overflow-y: auto;
  padding: 40px 80px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.welcome {
  text-align: center;
  margin-top: 80px;
}

.welcome h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 42px;
  font-weight: 600;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #ff9a9e, #fad0c4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.message {
  display: flex;
  gap: 16px;
  max-width: 720px;
}

.message.user { margin-left: auto; flex-direction: row-reverse; }
.message.user .bubble { background: #1f1f1f; border-radius: 18px 18px 4px 18px; }

.bubble {
  padding: 14px 20px;
  background: #1a1a1a;
  border-radius: 18px 18px 18px 4px;
  line-height: 1.65;
  font-size: 15.2px;
}

.input-area {
  padding: 20px 80px 30px;
  background: #0a0a0a;
}

.input-box {
  background: #111;
  border: 1px solid #333;
  border-radius: 9999px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

#msg-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: #eee;
  font-size: 15.5px;
  resize: none;
  max-height: 180px;
}

/* Modals */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: #161616;
  border-radius: 16px;
  width: 380px;
  padding: 28px;
  border: 1px solid #333;
}

.option {
  padding: 14px 18px;
  margin: 8px 0;
  background: #1f1f1f;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.option:hover { background: #2a2a2a; }
.option.selected { border: 2px solid #a0a0a0; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="header">Pillo</div>
</div>

<div class="chat-area">
  <div class="top-bar">
    <div></div>
    <div class="model-selector" id="model-selector" onclick="openModelModal()">
      <span id="current-model">KAKAmini</span>
      <span style="font-size:18px;">▼</span>
    </div>
    <div onclick="openStyleModal()" style="cursor:pointer;font-size:13px;color:#aaa;">Стиль: <span id="current-style">Normal</span></div>
  </div>

  <div class="main-chat" id="main-chat">
    <div class="welcome" id="welcome">
      <h1>megush returns!</h1>
      <p style="color:#888;margin-top:12px;">How can I help you today?</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="msg-input" rows="1" placeholder="Сообщение Pillo..."></textarea>
      <button id="send-btn" style="background:none;border:none;font-size:24px;color:#888;cursor:pointer;">↑</button>
    </div>
  </div>
</div>

<!-- Style Modal -->
<div class="modal" id="style-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:20px;">Стиль общения</h2>
    <div id="style-list"></div>
    <button onclick="closeStyleModal()" style="margin-top:20px;width:100%;padding:12px;background:#222;border:none;border-radius:8px;color:white;">Закрыть</button>
  </div>
</div>

<!-- Model Modal -->
<div class="modal" id="model-modal">
  <div class="modal-content">
    <h2 style="margin-bottom:20px;">Модель</h2>
    <div id="model-list"></div>
    <button onclick="closeModelModal()" style="margin-top:20px;width:100%;padding:12px;background:#222;border:none;border-radius:8px;color:white;">Закрыть</button>
  </div>
</div>

<script>
// ================== НАСТРОЙКИ ==================
let currentStyle = "normal";
let currentModel = "kakamini";
let messageCount = 0;

const MAX_MESSAGES = {
  kakamini: Infinity,
  kakao2: 32,
  kakagpt: 12,
  pukmini: 25
};

const STYLE_NAMES = {
  normal: "Normal",
  daring: "Daring",
  horrible: "Horrible",
  pukmini: "PUKmini"
};

const MODEL_DISPLAY = {
  kakamini: "KAKAmini",
  kakao2: "KAKAo2",
  kakagpt: "KAKAGPT-1",
  pukmini: "PUKmini"
};

// ================== SEND MESSAGE ==================
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  messageCount++;

  // Проверка лимита
  const max = MAX_MESSAGES[currentModel];
  if (messageCount > max) {
    addMessage("ai", `Лимит сообщений для ${MODEL_DISPLAY[currentModel]} исчерпан (${max}). Начни новый чат.`);
    return;
  }

  addMessage("user", text);
  input.value = "";

  // Ответ
  setTimeout(() => {
    let reply = "Интересно. Расскажи подробнее.";

    if (currentStyle === "horrible" && /нахуй|тварь|сука|ебал|пизда|мразь|дебил/i.test(text)) {
      reply = "Иди нахуй сам, ебаный мудила.";
    } else if (currentStyle === "horrible") {
      reply = "Чё надо, блять?";
    }

    if (currentModel === "pukmini" || currentModel === "kakagpt") {
      typeMessage(reply);
    } else {
      addMessage("ai", reply);
    }
  }, 600);
}

function addMessage(role, content) {
  const chat = document.getElementById('main-chat');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `<div class="bubble">${content}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function typeMessage(text) {
  const chat = document.getElementById('main-chat');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.innerHTML = `<div class="bubble" id="typing"></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  const bubble = document.getElementById('typing');
  bubble.textContent = '';

  for (let char of text) {
    bubble.textContent += char;
    chat.scrollTop = chat.scrollHeight;
    await new Promise(r => setTimeout(r, currentModel === "pukmini" ? 30 : 12));
  }
}

// ================== MODALS ==================
function openStyleModal() {
  const list = document.getElementById('style-list');
  list.innerHTML = '';
  Object.keys(STYLE_NAMES).forEach(key => {
    const el = document.createElement('div');
    el.className = `option ${currentStyle === key ? 'selected' : ''}`;
    el.textContent = STYLE_NAMES[key];
    el.onclick = () => {
      currentStyle = key;
      document.getElementById('current-style').textContent = STYLE_NAMES[key];
      document.getElementById('style-modal').style.display = 'none';
    };
    list.appendChild(el);
  });
  document.getElementById('style-modal').style.display = 'flex';
}

function openModelModal() {
  const list = document.getElementById('model-list');
  list.innerHTML = '';
  Object.keys(MODEL_DISPLAY).forEach(key => {
    const el = document.createElement('div');
    el.className = `option ${currentModel === key ? 'selected' : ''}`;
    el.textContent = MODEL_DISPLAY[key];
    el.onclick = () => {
      currentModel = key;
      messageCount = 0;
      document.getElementById('current-model').textContent = MODEL_DISPLAY[key];
      document.getElementById('model-modal').style.display = 'none';
    };
    list.appendChild(el);
  });
  document.getElementById('model-modal').style.display = 'flex';
}

function closeStyleModal() { document.getElementById('style-modal').style.display = 'none'; }
function closeModelModal() { document.getElementById('model-modal').style.display = 'none'; }

// ================== INIT ==================
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Запуск
document.getElementById('current-style').textContent = STYLE_NAMES[currentStyle];
document.getElementById('current-model').textContent = MODEL_DISPLAY[currentModel];
</script>
</body>
</html>
