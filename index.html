<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilloAI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #f0f0f0; font-size: 14px; line-height: 1.6; }
.page { display: none; position: fixed; inset: 0; }
.page.active { display: flex; }

/* AUTH */
#page-auth { align-items: center; justify-content: center; background: #0d0d0d; }
.auth-box { width: 320px; }
.auth-logo { font-family: 'Instrument Serif', serif; font-size: 42px; letter-spacing: -1.5px; color: #f0f0f0; margin-bottom: 4px; }
.auth-tagline { color: rgba(240,240,240,0.28); font-size: 13px; font-weight: 300; margin-bottom: 40px; }
.tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 28px; }
.tab-btn { flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 1.5px solid transparent; margin-bottom: -1px; color: rgba(240,240,240,0.3); font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.tab-btn.active { color: #f0f0f0; border-bottom-color: #f0f0f0; }
.auth-panel { display: none; flex-direction: column; gap: 14px; }
.auth-panel.active { display: flex; }
.field-wrap { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 11px; color: rgba(240,240,240,0.28); text-transform: uppercase; letter-spacing: .05em; }
.field { padding: 11px 13px; background: #181818; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; color: #f0f0f0; font-family: inherit; font-size: 14px; outline: none; }
.field:focus { border-color: rgba(255,255,255,0.25); }
.auth-error { font-size: 12px; color: #e05555; min-height: 16px; }
.submit-btn { padding: 12px; background: #f0f0f0; border: none; border-radius: 7px; color: #0d0d0d; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
.submit-btn:hover { opacity: 0.85; }

/* APP */
#page-app { flex-direction: row; }
.sidebar { width: 220px; flex-shrink: 0; background: #111; border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; }
.sb-head { padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: space-between; }
.sb-logo { font-family: 'Instrument Serif', serif; font-size: 20px; letter-spacing: -.3px; color: #f0f0f0; }
.sb-list { flex: 1; overflow-y: auto; padding: 8px; }
.chat-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background .12s; }
.chat-item:hover, .chat-item.active { background: #1c1c1c; }
.chat-item-title { font-size: 13px; color: rgba(240,240,240,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0d0d0d; }
.chat-header { padding: 13px 24px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #5fe87a; }
.mode-badge, .model-badge { 
  font-size: 11px; padding: 4px 11px; border-radius: 100px; 
  border: 1px solid rgba(255,255,255,0.12); color: rgba(240,240,240,0.75); 
  cursor: pointer; transition: all .15s; 
}
.mode-badge:hover, .model-badge:hover { border-color: rgba(255,255,255,0.4); color: #f0f0f0; }

#welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
.welcome-title { font-family: 'Instrument Serif', serif; font-size: 30px; letter-spacing: -.5px; color: #f0f0f0; margin-bottom: 8px; }
.welcome-sub { font-size: 13px; color: rgba(240,240,240,0.22); margin-bottom: 30px; }

#msgs-container { flex: 1; overflow-y: auto; padding: 20px 0 10px; }
.msg-row { display: flex; gap: 10px; padding: 6px 24px; animation: fadeUp 0.25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
.from-user { flex-direction: row-reverse; }
.msg-ava { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; background: #1c1c1c; border: 1px solid rgba(255,255,255,0.1); margin-top: 4px; }
.msg-bubble { max-width: min(520px, 78%); padding: 10px 15px; border-radius: 12px; font-size: 14.2px; line-height: 1.62; }
.from-user .msg-bubble { background: #181818; border: 1px solid rgba(255,255,255,0.09); border-bottom-right-radius: 4px; }
.from-ai .msg-bubble { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }

.input-wrap { padding: 12px 20px 20px; flex-shrink: 0; }
.input-row { display: flex; align-items: flex-end; gap: 8px; background: #161616; border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 10px 12px; }
#msg-input { flex: 1; background: none; border: none; color: #f0f0f0; font-size: 14.5px; resize: none; outline: none; max-height: 140px; line-height: 1.5; }
#send-btn { width: 34px; height: 34px; border: none; background: #222; color: #f0f0f0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

/* MODALS */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #131313; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; width: 380px; padding: 28px; max-height: 85vh; overflow-y: auto; }
.modal-title { font-family: 'Instrument Serif', serif; font-size: 24px; margin-bottom: 6px; }
.mode-option { padding: 14px 16px; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all .15s; }
.mode-option:hover { border-color: rgba(255,255,255,0.25); }
.mode-option.selected { border-color: #f0f0f0; background: #222; }
</style>
</head>
<body>

<!-- ====================== AUTH ====================== -->
<div id="page-auth" class="page active">
  <div class="auth-box">
    <div class="auth-logo">Pillo</div>
    <div class="auth-tagline">Ask anything.</div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="tab-btn" id="tab-reg" onclick="switchTab('reg')">Register</button>
    </div>
    <div class="auth-panel active" id="panel-login">
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="l-email" type="email" placeholder="you@email.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="l-pass" type="password" placeholder="••••••••"></div>
      <div class="auth-error" id="l-err"></div>
      <button class="submit-btn" onclick="doLogin()">Sign in</button>
    </div>
    <div class="auth-panel" id="panel-reg">
      <div class="field-wrap"><div class="field-label">Name</div><input class="field" id="r-name" type="text" placeholder="Your name"></div>
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="r-email" type="email" placeholder="you@email.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="r-pass" type="password" placeholder="Min 6 characters"></div>
      <div class="auth-error" id="r-err"></div>
      <button class="submit-btn" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<!-- ====================== APP ====================== -->
<div id="page-app" class="page">
  <div class="sidebar">
    <div class="sb-head">
      <span class="sb-logo">Pillo</span>
      <button onclick="startNewChat()" style="background:none;border:none;color:#aaa;cursor:pointer;font-size:20px;">+</button>
    </div>
    <div class="sb-list" id="sb-list">
      <div class="sb-empty" id="sb-empty">Пока нет чатов</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <div class="status-dot"></div>
      <span class="chat-header-label">PilloAI</span>
      <span class="mode-badge" id="mode-badge" onclick="openStyleModal()">🌟 Normal</span>
      <span class="model-badge" id="model-badge" onclick="openModelModal()">KAKAmini</span>
    </div>

    <div id="welcome">
      <div class="welcome-title">Привет, я Pillo</div>
      <div class="welcome-sub">Выбери стиль общения и модель, потом пиши что угодно</div>
    </div>

    <div id="msgs-container" style="display:none;"></div>

    <div class="input-wrap">
      <div class="input-row">
        <textarea id="msg-input" rows="1" placeholder="Напиши сообщение..."></textarea>
        <button id="send-btn">→</button>
      </div>
    </div>
  </div>
</div>

<!-- ====================== STYLE MODAL ====================== -->
<div class="modal-overlay" id="style-modal">
  <div class="modal">
    <div class="modal-title">Стиль общения</div>
    <div id="style-options"></div>
    <button onclick="closeStyleModal()" style="margin-top:20px;width:100%;padding:12px;background:#222;border:none;color:white;border-radius:8px;cursor:pointer;">Готово</button>
  </div>
</div>

<!-- ====================== MODEL MODAL ====================== -->
<div class="modal-overlay" id="model-modal">
  <div class="modal">
    <div class="modal-title">Модель ИИ</div>
    <div id="model-options"></div>
    <button onclick="closeModelModal()" style="margin-top:20px;width:100%;padding:12px;background:#222;border:none;color:white;border-radius:8px;cursor:pointer;">Готово</button>
  </div>
</div>

<script>
// ====================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ======================
let currentStyle = "normal";
let currentModel = "kakamini";
let currentUser = null;
let chatMap = {};
let activeChatId = null;
let isBusy = false;

const STYLE_EMOJI = {
  normal: "🌟",
  daring: "⚡",
  horrible: "☠️",
  pukmini: "🐷"
};

const MODEL_NAMES = {
  kakamini: "KAKAmini",
  kakao2: "KAKAo2",
  kakagpt: "KAKAGPT-1",
  pukmini: "PUKmini"
};

// ====================== HAS FUNCTION ======================
function has(text, keywords) {
  const lower = text.toLowerCase();
  return keywords.some(kw => lower.includes(kw.toLowerCase()));
}

// ====================== RESPONSE DATABASE ======================
const DB = [
  // Приветствия
  { id: 'greeting', check: t => has(t, ['привет','хай','hello','hi','здравствуй']), 
    r: { normal: "Привет! Чем могу помочь?", daring: "Привет. Что нужно?", horrible: "Ну привет, чё надо?", pukmini: "Привееет! 🐷 Чем помочь сегодня?" } },

  // Оскорбления (особенно сильные для Horrible)
  { id: 'insult', check: t => has(t, ['нахуй','тварь','сука','ебал','пидор','мразь','дебил','иди нахуй','заткнись','хуй','пизда','блять','урод']),
    r: { 
      normal: "Давай без оскорблений.", 
      daring: "Не начинай.", 
      horrible: ["Иди нахуй сам, ебаный мудила.", "Ты серьёзно, кусок говна? Я тебя в рот ебал.", "Заткни своё ебало, пока я тебе всю родословную не перечислил.", "Ебал я тебя и в рот, и в жопу, лошара."], 
      pukmini: "Ой... грубо как-то 🐷" 
    } },

  // Как дела
  { id: 'howru', check: t => has(t, ['как дела','how are you']), 
    r: { normal: "Всё отлично, спасибо! А у тебя?", horrible: "Нормально, не ной. Чё надо?", pukmini: "Отлично! А у тебя как? 🐷" } },

  // Кто ты
  { id: 'who', check: t => has(t, ['кто ты','что ты','ты кто']), 
    r: { normal: "Я — PilloAI, твой помощник.", horrible: "Я тот, кто сейчас будет тебя морально ебать, если будешь тупить.", pukmini: "Я PUKmini! Твой милый, но немного дерзкий помощник 🐷" } }
];

// ====================== FIND RESPONSE ======================
function findResponse(text) {
  const lower = text.toLowerCase();

  // Специальная обработка оскорблений для Horrible
  if (currentStyle === 'horrible' && has(lower, ['нахуй','тварь','сука','ебал','пидор','мразь','дебил','иди нахуй','заткнись'])) {
    const insults = [
      "Иди нахуй сам, ебаный мудила.",
      "Ты серьёзно, кусок говна? Я тебя в рот ебал.",
      "Заткни ебало, пока я тебе всю семью не перечислил.",
      "Ебал я тебя во все дыры, лошара.",
      "Ого, какой смелый в интернете, пиздюк."
    ];
    return insults[Math.floor(Math.random() * insults.length)];
  }

  // Основной поиск
  for (let item of DB) {
    if (item.check(lower)) {
      let responses = item.r[currentStyle] || item.r.normal;
      if (Array.isArray(responses)) return responses[Math.floor(Math.random()*responses.length)];
      return responses;
    }
  }

  // Fallback
  if (currentStyle === 'horrible') return "Чё несёшь? Говори по делу, блять.";
  if (currentStyle === 'daring') return "Говори конкретно. Что нужно?";
  if (currentStyle === 'pukmini') return "Хм... расскажи подробнее, пожалуйста 🐷";
  return "Интересно. Расскажи подробнее.";
}

// ====================== ПЕЧАТЬ ПО БУКВАМ ======================
async function typeResponse(text) {
  const container = document.getElementById('msgs-container');
  const row = document.createElement('div');
  row.className = 'msg-row from-ai';
  row.innerHTML = `<div class="msg-ava">AI</div><div class="msg-bubble" id="live-type"></div>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;

  const bubble = document.getElementById('live-type');
  bubble.textContent = '';

  const delay = (currentModel === 'pukmini') ? 32 : (currentModel === 'kakagpt') ? 14 : 8;

  for (let char of text) {
    bubble.textContent += char;
    container.scrollTop = container.scrollHeight;
    await new Promise(r => setTimeout(r, delay));
  }
}

// ====================== SEND MESSAGE ======================
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isBusy) return;

  isBusy = true;
  input.value = '';

  // Добавляем сообщение пользователя
  const container = document.getElementById('msgs-container');
  container.style.display = 'block';
  document.getElementById('welcome').style.display = 'none';

  const userRow = document.createElement('div');
  userRow.className = 'msg-row from-user';
  userRow.innerHTML = `<div class="msg-ava">Ты</div><div class="msg-bubble">${text}</div>`;
  container.appendChild(userRow);
  container.scrollTop = container.scrollHeight;

  // Thinking delay
  await new Promise(r => setTimeout(r, currentModel === 'pukmini' ? 1100 : 550));

  const reply = findResponse(text);

  if (currentModel === 'pukmini' || currentModel === 'kakagpt') {
    await typeResponse(reply);
  } else {
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row from-ai';
    aiRow.innerHTML = `<div class="msg-ava">AI</div><div class="msg-bubble">${reply}</div>`;
    container.appendChild(aiRow);
  }

  container.scrollTop = container.scrollHeight;
  isBusy = false;
}

// ====================== MODALS ======================
function openStyleModal() {
  const container = document.getElementById('style-options');
  container.innerHTML = '';
  const styles = ['normal','daring','horrible','pukmini'];
  styles.forEach(s => {
    const div = document.createElement('div');
    div.className = `mode-option ${currentStyle === s ? 'selected' : ''}`;
    div.innerHTML = `<span style="font-size:22px">${STYLE_EMOJI[s]}</span> ${s.charAt(0).toUpperCase() + s.slice(1)}`;
    div.onclick = () => {
      currentStyle = s;
      document.getElementById('mode-badge').innerHTML = `${STYLE_EMOJI[s]} ${s.charAt(0).toUpperCase() + s.slice(1)}`;
      closeStyleModal();
    };
    container.appendChild(div);
  });
  document.getElementById('style-modal').classList.add('open');
}

function closeStyleModal() {
  document.getElementById('style-modal').classList.remove('open');
}

function openModelModal() {
  const container = document.getElementById('model-options');
  container.innerHTML = '';
  Object.keys(MODEL_NAMES).forEach(m => {
    const div = document.createElement('div');
    div.className = `mode-option ${currentModel === m ? 'selected' : ''}`;
    div.textContent = MODEL_NAMES[m];
    div.onclick = () => {
      currentModel = m;
      document.getElementById('model-badge').textContent = MODEL_NAMES[m];
      closeModelModal();
    };
    container.appendChild(div);
  });
  document.getElementById('model-modal').classList.add('open');
}

function closeModelModal() {
  document.getElementById('model-modal').classList.remove('open');
}

// ====================== AUTH & BASIC ======================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${tab}`));
  document.querySelectorAll('.auth-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));
}

function doLogin() { /* упрощённо */ showApp(); }
function doRegister() { showApp(); }

function showApp() {
  document.getElementById('page-auth').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  startNewChat();
}

function startNewChat() {
  document.getElementById('msgs-container').innerHTML = '';
  document.getElementById('msgs-container').style.display = 'none';
  document.getElementById('welcome').style.display = 'flex';
}

// ====================== INIT ======================
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Автозапуск
setTimeout(() => {
  document.getElementById('page-auth').classList.remove('active');
  document.getElementById('page-app').classList.add('active');
  startNewChat();
}, 300);
</script>
</body>
</html>
