<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilloAI — Pro Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   STYLING SYSTEM (UI/UX)
============================================================
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: #0d0d0d;
  color: #f0f0f0;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Page Transitions */
.page { display: none; position: fixed; inset: 0; animation: fadeIn 0.4s ease; }
.page.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* AUTH PAGE */
#page-auth { align-items: center; justify-content: center; background: #080808; }
.auth-box { width: 340px; padding: 20px; text-align: left; }
.auth-logo {
  font-family: 'Instrument Serif', serif;
  font-size: 48px;
  letter-spacing: -2px;
  color: #fff;
  margin-bottom: 2px;
}
.auth-tagline { color: rgba(240,240,240,0.3); font-size: 14px; margin-bottom: 40px; }

.tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px; }
.tab-btn {
  flex: 1; padding: 12px 0;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: rgba(240,240,240,0.3); font-size: 13px; cursor: pointer;
  transition: all .2s;
}
.tab-btn.active { color: #fff; border-bottom-color: #fff; }

.auth-panel { display: none; flex-direction: column; gap: 16px; }
.auth-panel.active { display: flex; }

.field-wrap { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.field {
  padding: 12px 14px;
  background: #141414; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; outline: none;
}
.field:focus { border-color: rgba(255,255,255,0.25); background: #1a1a1a; }

.auth-error { font-size: 12px; color: #ff5f5f; min-height: 18px; font-weight: 500; }
.submit-btn {
  margin-top: 10px; padding: 14px; background: #fff; border: none; border-radius: 8px;
  color: #000; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s;
}
.submit-btn:hover { opacity: 0.9; }
.submit-btn:active { transform: scale(0.98); }

/* APP LAYOUT */
#page-app { flex-direction: row; }

/* SIDEBAR */
.sidebar {
  width: 260px; flex-shrink: 0; background: #111;
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex; flex-direction: column;
}
.sb-head { padding: 24px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
.sb-logo { font-family: 'Instrument Serif', serif; font-size: 24px; color: #fff; }
.new-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  background: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.new-btn:hover { background: rgba(255,255,255,0.05); }

.sb-list { flex: 1; overflow-y: auto; padding: 10px; }
.chat-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; cursor: pointer; margin-bottom: 2px; transition: background 0.2s;
}
.chat-item:hover { background: rgba(255,255,255,0.03); }
.chat-item.active { background: rgba(255,255,255,0.07); }
.chat-item-title { flex: 1; font-size: 13px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item.active .chat-item-title { color: #fff; font-weight: 500; }
.chat-item-del { opacity: 0; color: rgba(255,255,255,0.2); border: none; background: none; cursor: pointer; }
.chat-item:hover .chat-item-del { opacity: 1; }
.chat-item-del:hover { color: #ff5f5f; }

.sb-foot { padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
.user-ava { width: 32px; height: 32px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 1px solid rgba(255,255,255,0.1); }
.user-nm { flex: 1; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.logout-btn { background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; }
.logout-btn:hover { color: #fff; }

/* CHAT AREA */
.chat-area { flex: 1; display: flex; flex-direction: column; background: #0d0d0d; position: relative; }
.chat-header { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; }
.status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px rgba(16,185,129,0.4); }

#welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
.welcome-title { font-family: 'Instrument Serif', serif; font-size: 42px; margin-bottom: 12px; }
.welcome-sub { color: rgba(255,255,255,0.3); margin-bottom: 32px; max-width: 400px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; }
.chip { 
  padding: 8px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; font-size: 13px; color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.2s;
}
.chip:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-1px); }

#msgs-container { flex: 1; overflow-y: auto; padding: 24px 0; }
.msg-row { display: flex; gap: 16px; padding: 12px 24px; max-width: 850px; margin: 0 auto; width: 100%; animation: msgSlide 0.3s ease; }
@keyframes msgSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg-row.from-user { flex-direction: row-reverse; }

.msg-bubble { 
  max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 15px; 
  word-wrap: break-word; position: relative;
}
.from-user .msg-bubble { background: #fff; color: #000; border-bottom-right-radius: 2px; }
.from-ai .msg-bubble { background: #1a1a1a; color: #ececec; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.05); }

/* Message Markdown Styles */
.msg-bubble p { margin-bottom: 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble code { background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
.msg-bubble strong { font-weight: 600; color: #fff; }

/* INPUT */
.input-wrap { padding: 0 24px 24px; }
.input-container {
  max-width: 800px; margin: 0 auto; background: #161616; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 12px 16px; display: flex; align-items: flex-end; gap: 12px;
  transition: border-color 0.3s;
}
.input-container:focus-within { border-color: rgba(255,255,255,0.3); }
#msg-input {
  flex: 1; background: none; border: none; color: #fff; font-family: inherit; font-size: 15px;
  resize: none; outline: none; max-height: 200px; min-height: 24px;
}
#send-btn {
  width: 36px; height: 36px; background: #fff; border: none; border-radius: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
}
#send-btn:hover { transform: scale(1.05); }
#send-btn:disabled { opacity: 0.2; cursor: not-allowed; }

.typing-dots { display: flex; gap: 4px; padding: 10px; }
.typing-dots span { width: 6px; height: 6px; background: #555; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .msg-bubble { max-width: 90%; }
}
</style>
</head>
<body>

<div id="page-auth" class="page active">
  <div class="auth-box">
    <div class="auth-logo">Pillo</div>
    <div class="auth-tagline">Universal Intelligence. Simplified.</div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-reg" onclick="switchTab('reg')">Register</button>
    </div>
    <div id="panel-login" class="auth-panel active">
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="l-email" type="email" placeholder="you@example.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="l-pass" type="password" placeholder="••••••••"></div>
      <div class="auth-error" id="l-err"></div>
      <button class="submit-btn" onclick="doLogin()">Sign In</button>
    </div>
    <div id="panel-reg" class="auth-panel">
      <div class="field-wrap"><div class="field-label">Full Name</div><input class="field" id="r-name" type="text" placeholder="John Doe"></div>
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="r-email" type="email" placeholder="you@example.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="r-pass" type="password" placeholder="Min. 6 characters"></div>
      <div class="auth-error" id="r-err"></div>
      <button class="submit-btn" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<div id="page-app" class="page">
  <div class="sidebar">
    <div class="sb-head"><span class="sb-logo">Pillo</span><button class="new-btn" onclick="startNewChat()">+</button></div>
    <div class="sb-list" id="sb-list"></div>
    <div class="sb-foot">
      <div class="user-ava" id="user-ava"></div>
      <div class="user-nm" id="user-nm">User</div>
      <button class="logout-btn" onclick="doLogout()">Exit</button>
    </div>
  </div>
  <div class="chat-area">
    <div class="chat-header"><div class="status-dot"></div><span>PilloAI Active</span></div>
    
    <div id="welcome">
      <h1 class="welcome-title">How can I help you?</h1>
      <p class="welcome-sub">I understand complex questions, solve math, and chat in any language.</p>
      <div class="chips">
        <button class="chip" onclick="quickSend('Solve: (45 * 2) / 5')">Solve: (45 * 2) / 5</button>
        <button class="chip" onclick="quickSend('How to improve my sleep?')">Sleep tips</button>
        <button class="chip" onclick="quickSend('Write a small poem about AI')">Write a poem</button>
        <button class="chip" onclick="quickSend('Привет, как дела?')">Say Hi in Russian</button>
      </div>
    </div>

    <div id="msgs-container" style="display:none"></div>

    <div class="input-wrap">
      <div class="input-container">
        <textarea id="msg-input" rows="1" placeholder="Type your message..."></textarea>
        <button id="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//   CORE ENGINE
// ============================================================
let currentUser = null;
let chatMap = {};
let activeChatId = null;
let isBusy = false;

// Initialization
window.onload = () => {
  const savedSession = localStorage.getItem('pillo_session');
  if (savedSession) {
    currentUser = JSON.parse(savedSession);
    loadData();
    showPage('app');
  }
};

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  if (pageId === 'app') {
    document.getElementById('user-nm').innerText = currentUser.name;
    document.getElementById('user-ava').innerText = currentUser.name[0].toUpperCase();
    renderSidebar();
    startNewChat();
  }
}

// Auth Logic
function switchTab(tab) {
  document.getElementById('tab-login').className = 'tab-btn ' + (tab === 'login' ? 'active' : '');
  document.getElementById('tab-reg').className = 'tab-btn ' + (tab === 'reg' ? 'active' : '');
  document.getElementById('panel-login').className = 'auth-panel ' + (tab === 'login' ? 'active' : '');
  document.getElementById('panel-reg').className = 'auth-panel ' + (tab === 'reg' ? 'active' : '');
}

function doRegister() {
  const n = document.getElementById('r-name').value, e = document.getElementById('r-email').value, p = document.getElementById('r-pass').value;
  if (n.length < 2 || !e.includes('@') || p.length < 6) return document.getElementById('r-err').innerText = "Check your data!";
  currentUser = { name: n, email: e };
  localStorage.setItem('pillo_session', JSON.stringify(currentUser));
  showPage('app');
}

function doLogin() {
  const e = document.getElementById('l-email').value, p = document.getElementById('l-pass').value;
  if (e && p) {
    currentUser = { name: e.split('@')[0], email: e };
    localStorage.setItem('pillo_session', JSON.stringify(currentUser));
    loadData();
    showPage('app');
  }
}

function doLogout() {
  localStorage.removeItem('pillo_session');
  location.reload();
}

// Chat Management
function startNewChat() {
  activeChatId = 'ch_' + Date.now();
  chatMap[activeChatId] = { title: 'New Conversation', messages: [] };
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('msgs-container').style.display = 'none';
  document.getElementById('msgs-container').innerHTML = '';
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sb-list');
  list.innerHTML = '';
  Object.keys(chatMap).reverse().forEach(id => {
    if (chatMap[id].messages.length === 0 && id !== activeChatId) return;
    const item = document.createElement('div');
    item.className = 'chat-item ' + (id === activeChatId ? 'active' : '');
    item.innerHTML = `<span class="chat-item-title">${chatMap[id].title}</span><button class="chat-item-del" onclick="deleteChat('${id}', event)">×</button>`;
    item.onclick = () => selectChat(id);
    list.appendChild(item);
  });
}

function selectChat(id) {
  activeChatId = id;
  const container = document.getElementById('msgs-container');
  container.innerHTML = '';
  if (chatMap[id].messages.length > 0) {
    document.getElementById('welcome').style.display = 'none';
    container.style.display = 'block';
    chatMap[id].messages.forEach(m => appendBubble(m.role, m.content));
  } else {
    startNewChat();
  }
  renderSidebar();
}

function deleteChat(id, e) {
  e.stopPropagation();
  delete chatMap[id];
  saveData();
  if (id === activeChatId) startNewChat(); else renderSidebar();
}

// Messaging
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isBusy) return;

  input.value = '';
  input.style.height = 'auto';
  isBusy = true;
  document.getElementById('send-btn').disabled = true;

  if (chatMap[activeChatId].messages.length === 0) {
    chatMap[activeChatId].title = text.slice(0, 25) + (text.length > 25 ? '...' : '');
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('msgs-container').style.display = 'block';
  }

  chatMap[activeChatId].messages.push({ role: 'user', content: text });
  appendBubble('user', text);
  renderSidebar();
  
  // Typing state
  const loader = addTypingIndicator();
  
  // AI Response Simulation
  setTimeout(() => {
    loader.remove();
    const response = pilloBrain(text);
    chatMap[activeChatId].messages.push({ role: 'ai', content: response });
    appendBubble('ai', response);
    saveData();
    isBusy = false;
    document.getElementById('send-btn').disabled = false;
  }, 800);
}

function quickSend(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

// THE BRAIN OF PILLO (Local AI Logic)
function pilloBrain(input) {
  const raw = input.toLowerCase();
  const isEng = !/[а-яА-Я]/.test(input);

  // 1. Math Evaluator
  const mathMatch = input.match(/[0-9+\-*/().\s]{3,}/);
  if (mathMatch && !/[a-zA-Zа-яА-Я]/.test(mathMatch[0])) {
    try {
      const res = eval(mathMatch[0].replace(/[^-()\d/*+.]/g, ''));
      return isEng ? `The result is **${res}**. I've calculated this using my logic engine.` : `Результат вычисления: **${res}**. Я посчитал это автоматически.`;
    } catch(e) {}
  }

  // 2. Intelligent Responses with "Mistake Tolerance"
  const knowledge = [
    { keys: ['hi', 'hello', 'hey', 'привет', 'здрав'], eng: "Hello! I am PilloAI. I can help with coding, math, or just chatting. What's on your mind?", rus: "Привет! Я PilloAI. Я могу помочь с кодом, математикой или просто пообщаться. Что у тебя на уме?" },
    { keys: ['who', 'creator', 'кто ты', 'создатель'], eng: "I am PilloAI, a universal assistant. My goal is to make AI accessible and fast.", rus: "Я PilloAI, универсальный помощник. Моя цель — сделать ИИ доступным и быстрым." },
    { keys: ['poem', 'стих', 'рифи'], eng: "Silicon heart, a mind of light,\nI solve your problems through the night.\nFrom math to art, I'm here to stay,\nTo guide your work in every way.", rus: "В тишине двоичных кодов\nЯ лечу сквозь сотни строк.\nТвой помощник в мире модов,\nИИ знаний островок." },
    { keys: ['sleep', 'сон', 'уста'], eng: "To sleep better: 1. No screens 1h before. 2. Cool room temperature. 3. Avoid caffeine after 2 PM.", rus: "Для лучшего сна: 1. Никаких экранов за час. 2. Прохлада в комнате. 3. Никакого кофеина после 14:00." },
    { keys: ['err', 'ошиб', 'mistak', 'oops'], eng: "Don't worry about typos! I understand your intent anyway. I focus on the meaning.", rus: "Не переживай об опечатках! Я все равно тебя понимаю. Я смотрю на смысл." }
  ];

  for (let k of knowledge) {
    if (k.keys.some(key => raw.includes(key))) return isEng ? k.eng : k.rus;
  }

  // Default Fallback
  return isEng 
    ? `Interesting! I understand you are asking about "${input}". I'm constantly learning. Try asking me for a poem or a math problem!` 
    : `Интересно! Я понял твой вопрос про "${input}". Я постоянно учусь. Попробуй попросить меня написать стих или решить пример!`;
}

// UI Helpers
function appendBubble(role, content) {
  const container = document.getElementById('msgs-container');
  const div = document.createElement('div');
  div.className = 'msg-row ' + (role === 'user' ? 'from-user' : 'from-ai');
  div.innerHTML = `<div class="msg-bubble">${formatText(content)}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addTypingIndicator() {
  const container = document.getElementById('msgs-container');
  const div = document.createElement('div');
  div.className = 'msg-row from-ai';
  div.innerHTML = `<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function formatText(t) {
  return t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`(.*?)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
}

function saveData() {
  if (currentUser) localStorage.setItem('pillo_data_' + currentUser.email, JSON.stringify(chatMap));
}

function loadData() {
  const d = localStorage.getItem('pillo_data_' + currentUser.email);
  if (d) chatMap = JSON.parse(d);
}

// Listeners
document.getElementById('msg-input').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
};
</script>
</body>
</html>
