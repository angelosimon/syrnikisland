<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilloAI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #f0f0f0; font-size: 14px; line-height: 1.6; }
.page { display: none; position: fixed; inset: 0; }
.page.active { display: flex; }

/* AUTH */
#page-auth { align-items: center; justify-content: center; background: #0d0d0d; }
.auth-box { width: 320px; }
.auth-logo { font-family: 'Instrument Serif', serif; font-size: 42px; letter-spacing: -1.5px; color: #f0f0f0; margin-bottom: 4px; }
.auth-tagline { color: rgba(240,240,240,0.28); font-size: 13px; font-weight: 300; margin-bottom: 40px; }
.tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 28px; }
.tab-btn { flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 1.5px solid transparent; margin-bottom: -1px; color: rgba(240,240,240,0.3); cursor: pointer; }
.tab-btn.active { color: #f0f0f0; border-bottom-color: #f0f0f0; }
.auth-panel { display: none; flex-direction: column; gap: 14px; }
.auth-panel.active { display: flex; }
.field { padding: 11px 13px; background: #181818; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px; color: #f0f0f0; }
.submit-btn { padding: 12px; background: #f0f0f0; border: none; border-radius: 7px; color: #0d0d0d; font-weight: 500; cursor: pointer; }

/* APP */
#page-app { flex-direction: row; }
.sidebar { width: 220px; flex-shrink: 0; background: #111; border-right: 1px solid rgba(255,255,255,0.07); }
.sb-head { padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.sb-logo { font-family: 'Instrument Serif', serif; font-size: 20px; color: #f0f0f0; }

.chat-header { padding: 13px 24px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mode-badge, .model-badge {
  font-size: 11px; padding: 4px 10px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.12);
  color: rgba(240,240,240,0.7); cursor: pointer; margin: 2px;
}
.mode-badge:hover, .model-badge:hover { border-color: #f0f0f0; }

.msg-row { display: flex; gap: 10px; padding: 4px 24px; }
.from-user { flex-direction: row-reverse; }
.msg-bubble { max-width: 74%; padding: 9px 14px; border-radius: 11px; line-height: 1.65; }
.from-user .msg-bubble { background: #181818; border: 1px solid rgba(255,255,255,0.09); }
.from-ai .msg-bubble { background: #1c1c1c; color: #e8e8e8; }

/* Typing animation */
.typing-cursor { display: inline-block; width: 8px; height: 16px; background: #f0f0f0; vertical-align: middle; animation: blink 0.7s infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<!-- AUTH -->
<div id="page-auth" class="page active">
  <div class="auth-box">
    <div class="auth-logo">Pillo</div>
    <div class="auth-tagline">Ask anything.</div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign in</button>
      <button class="tab-btn" onclick="switchTab('reg')">Register</button>
    </div>
    <div class="auth-panel active" id="panel-login">
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="l-email" type="email" placeholder="you@email.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="l-pass" type="password" placeholder="••••••••"></div>
      <div class="auth-error" id="l-err"></div>
      <button class="submit-btn" onclick="doLogin()">Sign in</button>
    </div>
    <div class="auth-panel" id="panel-reg">
      <div class="field-wrap"><div class="field-label">Name</div><input class="field" id="r-name" type="text" placeholder="Your name"></div>
      <div class="field-wrap"><div class="field-label">Email</div><input class="field" id="r-email" type="email" placeholder="you@email.com"></div>
      <div class="field-wrap"><div class="field-label">Password</div><input class="field" id="r-pass" type="password" placeholder="Min 6 characters"></div>
      <div class="auth-error" id="r-err"></div>
      <button class="submit-btn" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="page-app" class="page">
  <div class="sidebar">
    <div class="sb-head">
      <span class="sb-logo">Pillo</span>
    </div>
    <!-- sidebar content можно оставить пустым или добавить позже -->
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <span>PilloAI</span>
      <span class="mode-badge" id="mode-badge" onclick="openStyleModal()">🌟 Normal</span>
      <span class="model-badge" id="model-badge" onclick="openModelModal()">KAKAmini</span>
    </div>

    <div id="welcome">
      <div class="welcome-title">Привет. Что хочешь?</div>
      <div class="welcome-sub">Выбери стиль и модель</div>
    </div>
    <div id="msgs-container" style="display:none; flex:1; overflow-y:auto; padding:20px 0;"></div>

    <div class="input-wrap" style="padding:10px 20px 20px;">
      <div style="display:flex; background:#161616; border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px;">
        <textarea id="msg-input" style="flex:1; background:none; border:none; color:#f0f0f0; resize:none; outline:none; font-size:14px;" rows="1" placeholder="Напиши что угодно..."></textarea>
        <button id="send-btn" style="width:36px; height:36px; background:none; border:none; color:#f0f0f0; cursor:pointer;">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- STYLE MODAL -->
<div class="modal-overlay" id="style-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:100;">
  <div style="background:#131313; width:380px; border-radius:14px; padding:24px;">
    <h2 style="margin-bottom:16px;">Стиль общения</h2>
    <div id="style-list"></div>
    <button onclick="closeStyleModal()" style="margin-top:20px; width:100%; padding:12px; background:#222; border:none; color:#f0f0f0; border-radius:8px;">Готово</button>
  </div>
</div>

<!-- MODEL MODAL -->
<div class="modal-overlay" id="model-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:100;">
  <div style="background:#131313; width:380px; border-radius:14px; padding:24px;">
    <h2 style="margin-bottom:16px;">Модель</h2>
    <div id="model-list"></div>
    <button onclick="closeModelModal()" style="margin-top:20px; width:100%; padding:12px; background:#222; border:none; color:#f0f0f0; border-radius:8px;">Готово</button>
  </div>
</div>

<script>
// ====================== НАСТРОЙКИ ======================
let currentStyle = 'normal';
let currentModel = 'kakamini';
let isBusy = false;
let currentUser = null;

// Названия
const styleNames = {
  normal:   "🌟 Normal",
  daring:   "⚡ Daring",
  horrible: "☠️ Horrible",
  pukmini:  "🐷 PUKmini"
};

const modelNames = {
  kakamini:  "KAKAmini",
  kakao2:    "KAKAo2",
  kakagpt:   "KAKAGPT-1",
  pukmini:   "PUKmini"
};

// ====================== HAS FUNCTION ======================
function has(text, words) {
  const t = text.toLowerCase();
  return words.some(w => t.includes(w.toLowerCase()));
}

// ====================== FIND RESPONSE ======================
function findResponse(input) {
  const t = input.trim().toLowerCase();

  // Специальный мат для Horrible
  if (currentStyle === 'horrible' && has(t, ['нахуй','тварь','сука','ебал','пидор','мразь','дебил','иди нахуй','заткнись','хуй','пизда','блять'])) {
    const replies = [
      "Иди нахуй сам, мудила ебаный.",
      "Ты серьёзно, кусок говна? Я тебя в рот ебал.",
      "Заткни ебало, пока я тебе всю семью не перечислил.",
      "Ого какой смелый в чате, пиздюк. Давай в реале попробуй.",
      "Ебал я тебя в рот, в жопу и в уши, лошара."
    ];
    return replies[Math.floor(Math.random() * replies.length)];
  }

  // Простой fallback
  if (currentStyle === 'horrible') {
    return "Чё надо, блять? Говори нормально.";
  }
  if (currentStyle === 'daring') {
    return "Говори по делу. Что хочешь?";
  }
  if (currentStyle === 'pukmini') {
    return "Хи-хи, расскажи подробнее~ 🐷";
  }
  return "Интересно. Расскажи подробнее.";
}

// ====================== UI ======================
function appendBubble(role, content) {
  const container = document.getElementById('msgs-container');
  const row = document.createElement('div');
  row.className = `msg-row ${role === 'user' ? 'from-user' : 'from-ai'}`;
  row.innerHTML = `
    <div style="width:24px;height:24px;border-radius:50%;background:#1c1c1c;display:flex;align-items:center;justify-content:center;font-size:10px;">
      ${role === 'user' ? 'Ты' : 'AI'}
    </div>
    <div class="msg-bubble">${role === 'user' ? content.replace(/\n/g,'<br>') : content}</div>
  `;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

async function typeMessage(text) {
  const container = document.getElementById('msgs-container');
  const row = document.createElement('div');
  row.className = 'msg-row from-ai';
  row.innerHTML = `<div style="width:24px;height:24px;border-radius:50%;background:#1c1c1c;display:flex;align-items:center;justify-content:center;font-size:10px;">AI</div>
                   <div class="msg-bubble" id="typing"></div>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;

  const bubble = document.getElementById('typing');
  bubble.textContent = '';

  for (let char of text) {
    bubble.textContent += char;
    container.scrollTop = container.scrollHeight;
    const delay = currentModel === 'pukmini' ? 35 : currentModel === 'kakagpt' ? 12 : 8;
    await new Promise(r => setTimeout(r, delay));
  }
}

// ====================== SEND ======================
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isBusy) return;

  appendBubble('user', text);
  input.value = '';
  isBusy = true;

  // Thinking
  await new Promise(r => setTimeout(r, currentModel === 'pukmini' ? 900 : 400));

  const reply = findResponse(text);

  if (currentModel === 'pukmini' || currentModel === 'kakagpt') {
    await typeMessage(reply);
  } else {
    appendBubble('ai', reply);
  }

  isBusy = false;
  document.getElementById('msgs-container').scrollTop = document.getElementById('msgs-container').scrollHeight;
}

// ====================== MODALS ======================
function openStyleModal() {
  const list = document.getElementById('style-list');
  list.innerHTML = '';
  Object.keys(styleNames).forEach(key => {
    const div = document.createElement('div');
    div.style.padding = '12px';
    div.style.margin = '6px 0';
    div.style.background = currentStyle === key ? '#222' : '#1a1a1a';
    div.style.borderRadius = '8px';
    div.style.cursor = 'pointer';
    div.textContent = styleNames[key];
    div.onclick = () => {
      currentStyle = key;
      document.getElementById('mode-badge').textContent = styleNames[key];
      closeStyleModal();
    };
    list.appendChild(div);
  });
  document.getElementById('style-modal').style.display = 'flex';
}

function closeStyleModal() {
  document.getElementById('style-modal').style.display = 'none';
}

function openModelModal() {
  const list = document.getElementById('model-list');
  list.innerHTML = '';
  Object.keys(modelNames).forEach(key => {
    const div = document.createElement('div');
    div.style.padding = '12px';
    div.style.margin = '6px 0';
    div.style.background = currentModel === key ? '#222' : '#1a1a1a';
    div.style.borderRadius = '8px';
    div.style.cursor = 'pointer';
    div.textContent = modelNames[key];
    div.onclick = () => {
      currentModel = key;
      document.getElementById('model-badge').textContent = modelNames[key];
      closeModelModal();
    };
    list.appendChild(div);
  });
  document.getElementById('model-modal').style.display = 'flex';
}

function closeModelModal() {
  document.getElementById('model-modal').style.display = 'none';
}

// ====================== EVENTS ======================
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Запуск
document.getElementById('mode-badge').textContent = styleNames[currentStyle];
document.getElementById('model-badge').textContent = modelNames[currentModel];

// Показываем приложение сразу (для теста)
document.getElementById('page-auth').classList.remove('active');
document.getElementById('page-app').classList.add('active');
</script>
</body>
</html>
