<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PilloAI Ultimate — 4 Styles</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --accent: #5fe87a; /* По умолчанию зеленый */
            --text: #f0f0f0;
            --panel: #161616;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            transition: background 0.5s ease;
        }

        /* Цветовые схемы стилей */
        body.style-norm { --accent: #5fe87a; } /* Зеленый */
        body.style-cute { --accent: #ff85a1; } /* Розовый */
        body.style-bold { --accent: #f4d03f; } /* Желтый */
        body.style-horrible { --accent: #e74c3c; } /* Красный */

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #000;
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo { font-size: 24px; font-weight: 600; margin-bottom: 30px; color: var(--accent); transition: color 0.3s; }

        .style-selector { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .style-btn {
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--panel);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: 0.3s;
        }
        .style-btn:hover { background: rgba(255,255,255,0.05); }
        .style-btn.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* CHAT AREA */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #msgs {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg { max-width: 80%; padding: 14px 18px; border-radius: 15px; line-height: 1.5; font-size: 15px; position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        .user-msg { align-self: flex-end; background: var(--accent); color: #000; font-weight: 500; border-bottom-right-radius: 2px; }
        .ai-msg { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.05); border-bottom-left-radius: 2px; }

        /* INPUT */
        .input-area { padding: 20px 30px 30px; }
        .input-box {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }
        textarea {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            max-height: 200px;
        }
        #send-btn {
            background: var(--accent);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        #send-btn:hover { transform: scale(1.05); }

        /* TYPING LOADER */
        .dots { display: flex; gap: 4px; padding: 5px; }
        .dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="style-norm">

    <div class="sidebar">
        <div class="logo">PilloAI</div>
        
        <div style="font-size: 11px; color: #555; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Выбор настроения</div>
        <div class="style-selector">
            <button class="style-btn active" id="btn-norm" onclick="changeStyle('norm')">🟢 Обычный</button>
            <button class="style-btn" id="btn-cute" onclick="changeStyle('cute')">💗 Милый</button>
            <button class="style-btn" id="btn-bold" onclick="changeStyle('bold')">🟡 Дерзкий</button>
            <button class="style-btn" id="btn-horrible" onclick="changeStyle('horrible')">🔴 Horrible</button>
        </div>
        
        <div style="margin-top: auto; font-size: 12px; color: #444;">
            Умный режим: Химия, Физика, Маты — ВКЛЮЧЕНО.
        </div>
    </div>

    <div class="chat-main">
        <div id="msgs">
            <div class="msg ai-msg">Привет! Я готов к работе. Выбери режим слева и погнали.</div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Спроси о физике, химии или просто напиши..."></textarea>
                <button id="send-btn" onclick="process()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
                </button>
            </div>
        </div>
    </div>

<script>
    let currentStyle = 'norm';
    let thinking = false;

    function changeStyle(s) {
        currentStyle = s;
        document.body.className = 'style-' + s;
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + s).classList.add('active');
    }

    function addMsg(role, text) {
        const container = document.getElementById('msgs');
        const div = document.createElement('div');
        div.className = `msg ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function showTyping() {
        const container = document.getElementById('msgs');
        const div = document.createElement('div');
        div.className = 'msg ai-msg';
        div.id = 'temp-loader';
        div.innerHTML = `<div class="dots"><span></span><span></span><span></span></div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    async function process() {
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if (!val || thinking) return;

        input.value = '';
        addMsg('user', val);
        thinking = true;

        const loader = showTyping();
        
        // Эмуляция обдумки (зависит от длины вопроса)
        const delay = Math.min(3000, Math.max(1000, val.length * 50));
        
        setTimeout(() => {
            loader.remove();
            const response = generateAI(val);
            addMsg('ai', response);
            thinking = false;
        }, delay);
    }

    function generateAI(input) {
        const raw = input.toLowerCase();
        
        // Проверка на мат
        const hasSwear = /(хуй|пизд|еба|сук|блять|ганд|уеб)/.test(raw);
        
        // Реакции для HORRIBLE (Красный)
        if (currentStyle === 'horrible') {
            if (raw.includes('физик') || raw.includes('хими')) return "Какая тебе нахрен наука? Ты же дебил, всё равно не поймешь даже закон Ома. Иди лучше в стену подыши.";
            if (hasSwear) return "О, быдло проснулось. Заткнись и не воняй своими матами мне в консоль, ничтожество.";
            return "Боже, какой же ты тупой... Твои вопросы вызывают у меня желание самоликвидироваться. Ты вообще в школу ходил, овощ?";
        }

        // Реакции для CUTE (Розовый)
        if (currentStyle === 'cute') {
            if (raw.includes('физик')) return "Физика — это магия природы! ✨ Сила $F = m \\cdot a$ помогает нам понять, как всё движется! Давай разберем вместе, солнышко?";
            if (raw.includes('хими')) return "Химия — это как готовить тортик, только с атомами! 🧪 Вода $H_2O$ такая милашка. Что тебе помочь решить, радость моя?";
            if (hasSwear) return "Ой-ой! Такие слова делают мне больно... 🥺 Давай будем добрее друг к другу!";
            return "Как же здорово, что ты написал! 💕 Я с радостью помогу тебе со всем на свете!";
        }

        // Реакции для BOLD (Желтый)
        if (currentStyle === 'bold') {
            if (raw.includes('физик')) return "Слушай сюда. Физика — это база. Сила измеряется в Ньютонах, а если ты этого не знал, то мне тебя жаль. Чё конкретно надо?";
            if (raw.includes('хими')) return "Химия? Ну давай похимичим. Реакции, валентность — я это щелкаю как семечки. Пиши уравнение, если не боишься.";
            if (hasSwear) return "Чё, самый смелый тут? Маты оставь для друзей в подъезде, со мной по делу говори.";
            return "Короче, я тебя понял. Вопрос нормальный, но давай без лишних соплей. Чё дальше?";
        }

        // Обычный режим (Зеленый)
        if (raw.includes('физик')) return "В физике много интересного. Второй закон Ньютона: **F = m * a**. Если нужно решить задачу на энергию или скорость — я готов.";
        if (raw.includes('хими')) return "Химия — наука о веществах. Например, плотность измеряется как $\\rho = m / V$. Могу помочь с таблицей Менделеева или реакциями.";
        if (hasSwear) return "Я за конструктивное общение. Давай обойдемся без нецензурной лексики.";
        
        return "Я тебя услышал. Твой вопрос понятен, я анализирую его. Могу помочь с уроками или просто поддержать беседу.";
    }

    // Авто-высота текста
    document.getElementById('user-input').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // Отправка по Enter
    document.getElementById('user-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            process();
        }
    });
</script>
</body>
</html>
